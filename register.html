
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | MindMap AI</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div style="max-width:420px; margin:70px auto; padding:25px;">
        <h1>✦ MindMap <span style="color:#b49aff">AI</span></h1>
        <h2 style="margin:25px 0 10px;">Create your account</h2>
        <p style="color:#aaa1cc; margin-bottom:20px;">
            Start your learning adventure.
        </p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p style="color:#ff9cbb; margin-bottom:12px;">
                    {{ message }}
                </p>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label>Full Name</label>
            <input name="name" type="text" required maxlength="100"
                   autocomplete="name" placeholder="Enter your name"
                   style="width:100%;padding:13px;margin:8px 0 18px;">

            <label>Email</label>
            <input name="email" type="email" required maxlength="254"
                   autocomplete="email" placeholder="Enter your email"
                   style="width:100%;padding:13px;margin:8px 0 18px;">

            <label>Password</label>
            <input name="password" type="password" required minlength="8"
                   autocomplete="new-password"
                   placeholder="At least 8 characters"
                   style="width:100%;padding:13px;margin:8px 0 18px;">

            <button class="primary-btn" style="width:100%;" type="submit">
                Create Account
            </button>
        </form>

        <p style="margin-top:20px;color:#aaa1cc;">
            Already registered?
            <a href="{{ url_for('login') }}" style="color:#b49aff;">
                Login
            </a>
        </p>
    </div>
</body>
</html>
